name: CodeQL

on:
  push:
    # dev as well: work lands there first, and a finding that only shows up at
    # release time is a finding found too late.
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    # Weekly on Sunday 05:00 UTC
    - cron: "0 5 * * 0"

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: python
          # Optional: add custom queries
          # queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:python"
